name: Bitcoin order app

on:
  push:
    branches: [githubcicd]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '16'
          cache: npm
      - name: Install dependencies
        run: npm ci --force
      - name: Build
        run: npm run build -- --base-href /bitcoin-order-app/
      - name: Lint TypeScript (report only)
        # Codelyzer relies on CommonJS and cannot load Angular 13's ESM compiler.
        run: npx --no-install tslint --project tsconfig.app.json --config ./node_modules/tslint/lib/configs/recommended.js --force
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/bitcoin

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate conventional changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: 'false'
          skip-git-pull: 'true'
      - name: Create release
        if: steps.changelog.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.clean_changelog }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "$RELEASE_NOTES"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
